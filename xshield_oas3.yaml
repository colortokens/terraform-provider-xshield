components:
  schemas:
    TemplateList:
      type: object
      properties:
        comment:
          type: string
          maxLength: 500
        templates:
          type: array
          items:
            type: string
          minItems: 1
    NamedNetworkList:
      type: object
      properties:
        comment:
          type: string
          maxLength: 500
        namednetworks:
          type: array
          items:
            type: string
          minItems: 1
    api.TemplatePayloadHashes:
      type: object
      properties:
        comment:
          maxLength: 500
          type: string
        paths:
          type: array
          items:
            type: string
        ports:
          type: array
          items:
            type: string
    datatypes.Type:
      type: string
      enum:
      - String
      - Timestamp
      - Numeric
      - Inet
      - Boolean
      - SemVer
    dev_azure_com_colortokens_asset_pkg_SecurityPatch:
      type: object
      properties:
        newRelease:
          type: string
        newVersion:
          type: string
        packageName:
          type: string
        release:
          type: string
        version:
          type: string
    metadata.ColumnDescriptor:
      type: object
      properties:
        coreTag:
          type: boolean
        dataType:
          $ref: '#/components/schemas/datatypes.Type'
        displayName:
          type: string
        facetable:
          type: boolean
        internalName:
          type: string
        listOfValues:
          type: boolean
        multivalued:
          type: boolean
        qualifier:
          type: string
        searchable:
          type: boolean
        sortable:
          type: boolean
        unit:
          type: string
        userDefined:
          type: boolean
        values:
          type: array
          items:
            $ref: '#/components/schemas/metadata.FieldValue'
    metadata.FieldValue:
      type: object
      properties:
        display:
          type: string
        internal:
          type: integer
        synonyms:
          type: array
          items:
            type: string
    metadata.NamedNetworkReference:
      type: object
      properties:
        namedNetworkId:
          type: string
        namedNetworkName:
          type: string
    metadata.TemplateRuleHitMetrics:
      type: object
      properties:
        lastEvaluated:
          type: string
        totalHits:
          type: string
    metadata.Path:
      type: object
      properties:
        channelHash:
          x-speakeasy-name-override: id        
          x-speakeasy-param-readonly: true          
          type: string
        destinationAssetID:
          type: string
        destinationNamedNetwork:
          $ref: '#/components/schemas/metadata.NamedNetworkReference'
        destinationTagBasedPolicy:
          $ref: '#/components/schemas/metadata.TagBasedPolicyReference'
        direction:
          type: string
        domain:
          type: string
        dstIp:
          type: string
        dstProcess:
          type: string
        method:
          type: string
        port:
          type: string
        portName:
          type: string
        protocol:
          type: string
        sourceAssetID:
          type: string
        sourceNamedNetwork:
          $ref: '#/components/schemas/metadata.NamedNetworkReference'
        sourceTagBasedPolicy:
          $ref: '#/components/schemas/metadata.TagBasedPolicyReference'
        srcIp:
          type: string
        srcProcess:
          type: string
        uri:
          type: string
    metadata.Port:
      type: object
      properties:
        listenPort:
          type: string
        listenPortName:
          type: string
        listenPortProtocol:
          type: string
        listenPortReviewed:
          $ref: '#/components/schemas/metadata.PortState'
        listenProcessNames:
          type: array
          items:
            type: string
        lpId:
          x-speakeasy-name-override: id        
          x-speakeasy-param-readonly: true          
          type: string
    metadata.PortState:
      type: string
      enum:
      - denied
      - allow-intranet
      - allow-any
      - path-restricted
    metadata.TagBasedPolicyReference:
      type: object
      properties:
        criteria:
          type: string
        tagBasedPolicyId:
          type: string
        tagBasedPolicyName:
          type: string
    ApplyNamedNetworkSearchInput:
      required:
      - criteria
      type: object
      properties:
        comment:
          maxLength: 500
          type: string
        criteria:
          type: string
        namedNetworkId:
          type: string
        namednetworks:
          type: array
          items:
            type: string
    ApplyTemplateSearchInput:
      required:
      - criteria
      type: object
      properties:
        comment:
          maxLength: 500
          type: string
        criteria:
          type: string
        templateId:
          type: string
        templates:
